<script>
    // ===== Dashboard / Converter =====
    function showConverter() {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('converter').classList.add('active');
    }

    function showDashboard() {
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('converter').classList.remove('active');
        document.getElementById('linkBox').style.display = 'none';
        document.getElementById('status').innerText = 'Ready to compile';
        stopSpectrum();
        stopLocalPlayback();
    }

    // ===== Spectrum Visualizer =====
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let source = null;
    let isPlaying = false;
    let animationId = null;
    let audioBuffer = null;
    let currentFile = null;

    const canvas = document.getElementById('spectrumCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        const wrapper = canvas.parentElement;
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function drawSpectrum() {
        if (!analyser) return;

        analyser.getByteFrequencyData(dataArray);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / dataArray.length) * 2.5;
        let x = 0;

        for (let i = 0; i < dataArray.length; i++) {
            const value = dataArray[i];
            const percent = value / 255;
            const height = canvas.height * percent * 0.9;

            const gradient = ctx.createLinearGradient(0, canvas.height - height, 0, canvas.height);
            gradient.addColorStop(0, '#1a3a6a');
            gradient.addColorStop(0.5, '#2a5a8a');
            gradient.addColorStop(1, '#0a1a3a');

            ctx.fillStyle = gradient;
            ctx.fillRect(x, canvas.height - height, barWidth - 1, height);

            x += barWidth;
        }

        animationId = requestAnimationFrame(drawSpectrum);
    }

    function toggleSpectrumPlay() {
        if (isPlaying) {
            stopSpectrum();
        } else {
            playSpectrum();
        }
    }

    function playSpectrum() {
        if (!audioBuffer) return;

        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioContext.state === 'suspended') {
            audioContext.resume();
        }

        source = audioContext.createBufferSource();
        source.buffer = audioBuffer;

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        source.connect(analyser);
        analyser.connect(audioContext.destination);

        source.onended = () => {
            stopSpectrum();
        };

        source.start();
        isPlaying = true;
        document.getElementById('playBtn').textContent = '⏹ Stop';

        resizeCanvas();
        drawSpectrum();
    }

    function stopSpectrum() {
        if (source) {
            try { source.stop(); } catch(e) {}
            source = null;
        }
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        isPlaying = false;
        document.getElementById('playBtn').textContent = '▶ Play';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    document.getElementById('mediaFile').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        const spectrumContainer = document.getElementById('spectrumContainer');
        const fileNameDisplay = document.getElementById('spectrumFileName');

        if (!file) {
            spectrumContainer.style.display = 'none';
            return;
        }

        spectrumContainer.style.display = 'block';
        fileNameDisplay.textContent = file.name;
        currentFile = file;

        try {
            const arrayBuffer = await file.arrayBuffer();
            const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);

            const offlineCtx = new OfflineAudioContext(
                audioBuffer.numberOfChannels,
                audioBuffer.length,
                audioBuffer.sampleRate
            );
            const sourceNode = offlineCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.connect(offlineCtx.destination);
            sourceNode.start();
            audioBuffer = await offlineCtx.startRendering();

            resizeCanvas();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

        } catch (err) {
            console.error('Error loading audio for spectrum:', err);
        }
    });

    // ===== LOCAL BYTEBEAT PLAYER (AudioWorklet) =====
    // Этот плеер проигрывает ту самую строку, которую мы только что сгенерировали.
    let localWorkletUrl = null;
    let localAudioCtx = null;
    let localWorkletNode = null;
    let localAnalyser = null;
    let localAnimationId = null;
    let localIsPlaying = false;
    let localCurrentHex = "";
    let localCurrentLength = 0;
    let localCurrentRate = 32000;

    // Исходник воркера
    const LOCAL_WORKLET_SOURCE = [
        'class LocalBytebeatProcessor extends AudioWorkletProcessor {',
        '    static get parameterDescriptors() {',
        '        return [',
        '            { name: "speed", defaultValue: 32000, minValue: 1, maxValue: 192000 }',
        '        ];',
        '    }',
        '    constructor() {',
        '        super();',
        '        this.currentTime = 0;',
        '        this.hexString = "";',
        '        this.hexLength = 0;',
        '        this.hexBytes = null;',
        '        var selfReference = this;',
        '        this.port.onmessage = function(event) {',
        '            if (event.data.type === "code") {',
        '                selfReference.hexString = event.data.hex;',
        '                selfReference.hexLength = event.data.length;',
        '                // Переводим "\\xNN\\xNN..." в Uint8Array',
        '                var bytes = new Uint8Array(selfReference.hexLength);',
        '                for (var i = 0; i < selfReference.hexLength; i++) {',
        '                    var pos = i * 4;',
        '                    var high = selfReference.hexString.charAt(pos + 2);',
        '                    var low  = selfReference.hexString.charAt(pos + 3);',
        '                    bytes[i] = parseInt(high + low, 16);',
        '                }',
        '                selfReference.hexBytes = bytes;',
        '                selfReference.port.postMessage({ type: "ready" });',
        '            } else if (event.data.type === "reset") {',
        '                selfReference.currentTime = 0;',
        '            }',
        '        };',
        '    }',
        '    process(inputs, outputs, parameters) {',
        '        var outputChannel = outputs[0][0];',
        '        if (!outputChannel) return true;',
        '        var speed = parameters.speed[0];',
        '        var increment = speed / sampleRate;',
        '        var time = this.currentTime;',
        '        var bytes = this.hexBytes;',
        '        var length = this.hexLength;',
        '        for (var index = 0; index < outputChannel.length; index++) {',
        '            var value = 0;',
        '            if (bytes !== null && length > 0) {',
        '                var byteIndex = (time | 0) % length;',
        '                value = bytes[byteIndex];',
        '            }',
        '            outputChannel[index] = (value - 128) / 128;',
        '            time = time + increment;',
        '        }',
        '        this.currentTime = time;',
        '        return true;',
        '    }',
        '}',
        'registerProcessor("local-bytebeat-processor", LocalBytebeatProcessor);'
    ].join('\n');

    function ensureLocalPlayerReady() {
        return new Promise(function(resolve, reject) {
            if (localAudioCtx !== null && localWorkletNode !== null) {
                resolve();
                return;
            }
            if (localWorkletUrl === null) {
                var blob = new Blob([LOCAL_WORKLET_SOURCE], { type: 'application/javascript' });
                localWorkletUrl = URL.createObjectURL(blob);
            }
            try {
                localAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (err) {
                reject(new Error('AudioContext не создан: ' + err.message));
                return;
            }
            localAudioCtx.audioWorklet.addModule(localWorkletUrl).then(function() {
                localWorkletNode = new AudioWorkletNode(localAudioCtx, 'local-bytebeat-processor');
                localAnalyser = localAudioCtx.createAnalyser();
                localAnalyser.fftSize = 1024;
                localWorkletNode.connect(localAnalyser);
                localAnalyser.connect(localAudioCtx.destination);
                resolve();
            }).catch(function(err) {
                reject(new Error('AudioWorklet не загрузился: ' + err.message));
            });
        });
    }

    function startLocalPlayback() {
        if (localCurrentHex === "" || localCurrentLength === 0) {
            alert('Сначала скомпилируй трек.');
            return;
        }
        ensureLocalPlayerReady().then(function() {
            if (localAudioCtx.state === 'suspended') {
                localAudioCtx.resume();
            }
            localWorkletNode.parameters.get('speed').value = localCurrentRate;
            localWorkletNode.port.postMessage({ type: 'reset' });
            localWorkletNode.port.postMessage({
                type: 'code',
                hex: localCurrentHex,
                length: localCurrentLength
            });
            localIsPlaying = true;
            var btn = document.getElementById('localPlayBtn');
            if (btn) btn.textContent = '⏸ Пауза';
            drawLocalWaveform();
        }).catch(function(err) {
            document.getElementById('status').innerText = 'Ошибка плеера: ' + err.message;
        });
    }

    function stopLocalPlayback() {
        localIsPlaying = false;
        var btn = document.getElementById('localPlayBtn');
        if (btn) btn.textContent = '▶ Проиграть здесь';
        if (localAnimationId !== null) {
            cancelAnimationFrame(localAnimationId);
            localAnimationId = null;
        }
        var lc = document.getElementById('localWave');
        if (lc) {
            var lctx = lc.getContext('2d');
            lctx.fillStyle = '#060a12';
            lctx.fillRect(0, 0, lc.width, lc.height);
        }
    }

    function drawLocalWaveform() {
        if (localIsPlaying === false || localAnalyser === null) return;
        var lc = document.getElementById('localWave');
        if (!lc) return;
        if (lc.width !== lc.clientWidth) lc.width = lc.clientWidth;
        if (lc.height !== lc.clientHeight) lc.height = lc.clientHeight;
        var lctx = lc.getContext('2d');
        var data = new Uint8Array(localAnalyser.fftSize);
        localAnalyser.getByteTimeDomainData(data);
        lctx.fillStyle = '#060a12';
        lctx.fillRect(0, 0, lc.width, lc.height);
        lctx.strokeStyle = '#4a8ad8';
        lctx.lineWidth = 1.5;
        lctx.beginPath();
        var step = Math.floor(data.length / lc.width);
        if (step < 1) step = 1;
        for (var x = 0; x < lc.width; x++) {
            var v = data[x * step] / 128.0;
            var y = (v * lc.height) / 2;
            if (x === 0) lctx.moveTo(x, y); else lctx.lineTo(x, y);
        }
        lctx.stroke();
        localAnimationId = requestAnimationFrame(drawLocalWaveform);
    }

    function toggleLocalPlayback() {
        if (localIsPlaying) stopLocalPlayback();
        else startLocalPlayback();
    }

    function copyLocalCode() {
        if (localCurrentHex === "") {
            alert('Сначала скомпилируй трек.');
            return;
        }
        // Собираем полную строку Dollchan-формулы
        var formulaText = 'globalThis.A||(A="' + localCurrentHex + '"),A.charCodeAt(t%' + localCurrentLength + ')';
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(formulaText).then(function() {
                var btn = document.getElementById('localCopyBtn');
                var old = btn.textContent;
                btn.textContent = '✅ Скопировано';
                setTimeout(function() { btn.textContent = old; }, 1500);
            }).catch(function() {
                fallbackCopy(formulaText);
            });
        } else {
            fallbackCopy(formulaText);
        }
    }

    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            var btn = document.getElementById('localCopyBtn');
            var old = btn.textContent;
            btn.textContent = '✅ Скопировано';
            setTimeout(function() { btn.textContent = old; }, 1500);
        } catch (e) {
            alert('Не удалось скопировать. Выдели и скопируй вручную.');
        }
        document.body.removeChild(ta);
    }

    // ===== Main Compile Function =====
    async function generateAccurateLink() {
        const fileInput = document.getElementById('mediaFile');
        const rateSelect = document.getElementById('sampleRate');
        const status = document.getElementById('status');
        const linkBox = document.getElementById('linkBox');

        if (!fileInput.files.length) {
            status.innerText = 'Error: Please choose a file first.';
            return;
        }

        if (isPlaying) stopSpectrum();
        stopLocalPlayback();

        status.innerText = 'Extracting sound wave data...';
        linkBox.style.display = 'none';

        try {
            const sampleRate = parseInt(rateSelect.value);
            const arrayBuffer = await fileInput.files[0].arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            const offlineCtx = new OfflineAudioContext(1, Math.floor(audioBuffer.duration * sampleRate), sampleRate);
            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineCtx.destination);
            source.start();

            const rendered = await offlineCtx.startRendering();
            const floats = rendered.getChannelData(0);

            status.innerText = 'Encoding PCM stream...';

            let hexString = "";
            for (let i = 0; i < floats.length; i++) {
                let b = Math.floor((floats[i] + 1.0) * 127.5);
                b = Math.max(0, Math.min(255, b));
                let hex = b.toString(16).padStart(2, '0');
                hexString += "\\x" + hex;
            }

            status.innerText = 'Packing Dollchan payload...';

            const bytebeatFormula = `globalThis.A||(A="${hexString}"),A.charCodeAt(t%${floats.length})`;

            const configObject = {
                formula: bytebeatFormula,
                sampleRate: sampleRate,
                mode: "Bytebeat"
            };

            const jsonStr = JSON.stringify(configObject);
            const deflated = pako.deflateRaw(jsonStr);

            let binaryString = "";
            for (let i = 0; i < deflated.length; i++) {
                binaryString += String.fromCharCode(deflated[i]);
            }
            const base64Hash = btoa(binaryString);

            const finalUrl = `https://dollchan.net/bytebeat/#v3b64${base64Hash}`;

            // Сохраняем данные для локального плеера
            localCurrentHex = hexString;
            localCurrentLength = floats.length;
            localCurrentRate = sampleRate;

            status.innerText = 'Success! Track compiled.';

            linkBox.style.display = 'block';
            linkBox.innerHTML = `
                <a href="${finalUrl}" target="_blank">Open in Dollchan</a>
                <div class="small-text" style="margin-top:6px;">Click to listen to your audio</div>

                <div style="margin-top:16px; padding-top:16px; border-top:1px dashed #0a1628;">
                    <div style="font-size:13px; color:#8899bb; margin-bottom:8px; letter-spacing:0.5px;">Local Preview</div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <button id="localPlayBtn" onclick="toggleLocalPlayback()" style="width:auto; flex:1; min-width:140px; margin:0; padding:10px 18px; font-size:14px;">▶ Проиграть здесь</button>
                        <button id="localCopyBtn" onclick="copyLocalCode()" style="width:auto; flex:1; min-width:140px; margin:0; padding:10px 18px; font-size:14px;">📋 Скопировать код</button>
                    </div>
                    <canvas id="localWave" style="width:100%; height:60px; margin-top:12px; display:block; border-radius:6px; background:#060a12; border:1px solid #0a1628;"></canvas>
                    <div class="small-text" style="margin-top:6px;">Проигрывается та же строка, что и в Dollchan</div>
                </div>
            `;

        } catch (err) {
            console.error(err);
            status.innerText = 'Error decoding audio. Keep your input clip short!';
        }
    }
  </script>
